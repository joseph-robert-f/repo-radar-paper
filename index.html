<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Repo Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%232a78d6' stroke-width='2.5'/%3E%3Cpath d='M16 16 L26 9' stroke='%231c5cab' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Newsprint reuses the validated tokens from the dashboard: the warm off-white
     surfaces and near-black text already read as paper and ink, and the recency
     ramp still carries the only data color on the page (the weather box). */
  :root {
    color-scheme: light;
    --paper: #f7f6f1;
    --paper-2: #fcfcfb;
    --ink: #12110f;
    --ink-2: #45433e;
    --ink-3: #7c7a73;
    --rule: #c3c2b7;
    --rule-faint: #e1e0d9;

    --recency-hot: #1c5cab;
    --recency-active: #2a78d6;
    --recency-idle: #5598e7;
    --recency-dormant: #86b6ef;
    --hm-0: #e3e1d9; --hm-1: #cde2fb; --hm-2: #9ec5f4; --hm-3: #5598e7; --hm-4: #1c5cab;
    --status-warning: #fab219;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --paper: #131312;
      --paper-2: #1a1a19;
      --ink: #f4f3ef;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --rule: #3a3a37;
      --rule-faint: #2c2c2a;
      --recency-hot: #86b6ef;
      --recency-active: #5598e7;
      --recency-idle: #2a78d6;
      --recency-dormant: #184f95;
      --hm-0: #2c2c2a; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #131312; --paper-2: #1a1a19;
    --ink: #f4f3ef; --ink-2: #c3c2b7; --ink-3: #898781;
    --rule: #3a3a37; --rule-faint: #2c2c2a;
    --recency-hot: #86b6ef; --recency-active: #5598e7; --recency-idle: #2a78d6; --recency-dormant: #184f95;
    --hm-0: #2c2c2a; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 1180px; margin: 0 auto; padding: 26px 22px 70px; }
  a { color: inherit; }

  /* ---------------- masthead ---------------- */
  .masthead { border-bottom: 3px double var(--ink); padding-bottom: 10px; margin-bottom: 8px; }
  .mast-top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); border-bottom: 1px solid var(--rule);
    padding-bottom: 7px; margin-bottom: 12px;
  }
  .mast-top .spacer { flex: 1 1 auto; }
  .mast-top button {
    font: inherit; letter-spacing: 0.14em; text-transform: uppercase;
    background: none; border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink-2); padding: 3px 8px; cursor: pointer;
  }
  .mast-top button:hover { background: var(--paper-2); color: var(--ink); }
  .mast-top a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); }
  .mast-top a:hover { color: var(--ink); }

  h1.nameplate {
    margin: 0; text-align: center; font-weight: 700;
    font-size: clamp(38px, 8.5vw, 78px); line-height: 0.94;
    letter-spacing: -0.02em; font-variant: small-caps;
  }
  .nameplate .radar { display: inline-block; width: .78em; height: .78em; vertical-align: -0.06em; margin-right: .12em; }
  .nameplate .radar circle, .nameplate .radar path { fill: none; stroke: currentColor; stroke-width: 2.4; }
  .nameplate .radar .sweep { transform-origin: 16px 16px; animation: sweep 1.6s cubic-bezier(.3,0,.2,1) 1; }
  @keyframes sweep { from { transform: rotate(-360deg); opacity: 0; } to { transform: rotate(0); opacity: 1; } }

  .mast-rule {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--rule);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-2);
  }

  /* ---------------- the lede ---------------- */
  .lede {
    font-size: 18.5px; line-height: 1.5; text-align: center;
    max-width: 70ch; margin: 16px auto 20px; color: var(--ink);
  }
  .lede b { font-weight: 700; }
  .lede .quiet { color: var(--ink-2); }

  /* ---------------- grid ---------------- */
  .press { display: grid; grid-template-columns: 2.1fr 1fr; gap: 0 26px; align-items: start; }
  .col-main { min-width: 0; border-right: 1px solid var(--rule); padding-right: 26px; }
  .col-rail { min-width: 0; }
  .below { border-top: 3px double var(--ink); margin-top: 24px; padding-top: 20px; }
  .below-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 24px; }
  .below-grid > * { min-width: 0; }
  .below-grid > * + * { border-left: 1px solid var(--rule-faint); padding-left: 24px; }

  /* ---------------- articles ---------------- */
  article { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule-faint); }
  article:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .kicker {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 7px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .kicker .pip { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pip.hot { background: var(--recency-hot); }
  .pip.active { background: var(--recency-active); }
  .pip.idle { background: var(--recency-idle); }
  .pip.dormant { background: var(--recency-dormant); }

  h2.hed { margin: 0 0 8px; line-height: 1.08; letter-spacing: -0.015em; font-weight: 700; }
  .lead h2.hed { font-size: clamp(30px, 4.4vw, 44px); }
  .second h2.hed { font-size: 24px; }
  .brief-story h2.hed { font-size: 18.5px; }
  h2.hed a { text-decoration: none; }
  h2.hed a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .deck { font-size: 16px; color: var(--ink-2); font-style: italic; margin: 0 0 11px; line-height: 1.45; }
  .lead .deck { font-size: 18px; }

  .byline {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 10px;
  }

  .body p { margin: 0 0 9px; }
  .body p:last-child { margin-bottom: 0; }
  .body .dateline { font-variant: small-caps; letter-spacing: 0.04em; font-weight: 700; }
  .lead .body { columns: 2; column-gap: 24px; font-size: 15.5px; }
  .lead .body p { break-inside: avoid; }
  .second .body, .brief-story .body { font-size: 14.5px; }

  figure { margin: 0 0 12px; }
  figure svg { display: block; width: 100%; height: auto; border: 1px solid var(--rule); background: var(--paper-2); }
  figcaption {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.4;
  }

  /* ---------------- boxed rail items ---------------- */
  .box { border: 1px solid var(--ink); padding: 14px 15px; margin-bottom: 20px; background: var(--paper-2); }
  .box.rules { border-width: 3px; border-style: double; }
  .box h3 {
    margin: 0 0 10px; font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink);
    padding-bottom: 7px; border-bottom: 1px solid var(--rule);
  }
  .notice { display: block; text-decoration: none; padding: 8px 0; border-bottom: 1px dotted var(--rule); }
  .notice:last-child { border-bottom: none; padding-bottom: 0; }
  .notice:hover .n-title { text-decoration: underline; text-underline-offset: 2px; }
  .n-title { display: block; font-size: 14.5px; line-height: 1.35; }
  .n-meta {
    display: block; margin-top: 3px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  }
  .n-meta .warn { color: var(--status-warning); }
  .n-meta .crit { color: var(--status-critical); }
  .allclear { font-size: 14.5px; color: var(--ink-2); font-style: italic; }

  /* ---------------- since the last edition ---------------- */
  .since p { margin: 0 0 7px; font-size: 14.5px; line-height: 1.45; }
  .since p:last-child { margin-bottom: 0; }
  .since .none { font-style: italic; color: var(--ink-2); }
  .since b { font-weight: 700; }
  .since .gone { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--ink-2); }

  .kicker .chip {
    font-size: 9.5px; letter-spacing: 0.12em; padding: 1px 5px;
    border: 1px solid currentColor; border-radius: 2px;
  }
  .chip.new { color: var(--recency-hot); }
  .chip.moved { color: var(--ink-2); }

  /* ---------------- back issues ---------------- */
  .mast-top select {
    font: inherit; font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: 1px solid var(--rule); border-radius: 2px;
    color: var(--ink-2); padding: 3px 6px; cursor: pointer; max-width: 12rem;
  }
  .backnotice {
    border: 3px double var(--ink); background: var(--paper-2);
    padding: 11px 14px; margin-bottom: 18px; font-size: 14.5px; text-align: center;
  }
  .backnotice b { font-variant: small-caps; letter-spacing: 0.05em; }
  .backnotice button {
    font: inherit; font-size: 13px; background: none; border: none;
    color: var(--ink); text-decoration: underline; cursor: pointer; padding: 0;
  }

  /* ---------------- the back page ---------------- */
  .backpage { border-top: 3px double var(--ink); margin-top: 24px; padding-top: 18px; }
  .backpage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  .backpage-grid > * { min-width: 0; }
  .backpage-grid > * + * { border-left: 1px solid var(--rule-faint); padding-left: 26px; }
  .secthead {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px;
  }
  .secthead .count { color: var(--ink-3); letter-spacing: 0.08em; }

  /* classifieds — dense, small, ruled */
  .ads { columns: 2; column-gap: 18px; font-size: 12.5px; line-height: 1.4; }
  .ad { break-inside: avoid; padding: 7px 0; border-bottom: 1px dotted var(--rule); }
  .ad .lead-in {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-3);
    display: block; margin-bottom: 2px;
  }
  .ad a { text-decoration: none; }
  .ad a:hover { text-decoration: underline; }
  .ad .where { color: var(--ink-2); display: block; margin-top: 2px; font-size: 11.5px; }

  /* letters */
  .letter { padding: 9px 0; border-bottom: 1px dotted var(--rule); font-size: 14px; line-height: 1.5; }
  .letter:last-child { border-bottom: none; }
  .letter .salut { font-variant: small-caps; letter-spacing: 0.04em; font-weight: 700; }
  .letter a { text-decoration: none; }
  .letter a:hover { text-decoration: underline; }
  .letter .sign { display: block; text-align: right; font-style: italic; color: var(--ink-2); font-size: 12.5px; margin-top: 3px; }

  /* obituaries, forecast, on this day */
  .obit { padding: 7px 0; border-bottom: 1px dotted var(--rule); font-size: 13.5px; line-height: 1.45; }
  .obit:last-child { border-bottom: none; }
  .obit .who { font-weight: 700; }
  .forecast p, .onthis p { margin: 0 0 6px; font-size: 14px; line-height: 1.45; }
  .forecast p:last-child, .onthis p:last-child { margin-bottom: 0; }
  .forecast .glass {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); display: block; margin-bottom: 5px;
  }

  @media (max-width: 900px) {
    .backpage-grid { grid-template-columns: 1fr; }
    .backpage-grid > * + * { border-left: none; padding-left: 0; border-top: 1px solid var(--rule-faint); padding-top: 16px; margin-top: 16px; }
    .ads { columns: 1; }
  }

  /* ---------------- in brief ---------------- */
  .brief-item { padding: 7px 0; border-bottom: 1px dotted var(--rule); }
  .brief-item:last-child { border-bottom: none; }
  .brief-item .bi-name { font-weight: 700; }
  .brief-item .bi-name a { text-decoration: none; }
  .brief-item .bi-name a:hover { text-decoration: underline; }
  .brief-item .bi-meta { color: var(--ink-3); font-size: 13.5px; }

  /* ---------------- weather (the heatmap) ---------------- */
  .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
  .hm-months {
    display: grid; grid-auto-flow: column; gap: 2px; width: max-content;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); height: 13px;
  }
  .hm-months span { white-space: nowrap; overflow: visible; }
  .hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 9px); gap: 2px; width: max-content; }
  .hm i { width: 9px; height: 9px; background: var(--hm-0); display: block; transition: transform .1s ease; }
  .hm i[data-l="1"] { background: var(--hm-1); }
  .hm i[data-l="2"] { background: var(--hm-2); }
  .hm i[data-l="3"] { background: var(--hm-3); }
  .hm i[data-l="4"] { background: var(--hm-4); }
  .hm i[data-d]:hover { transform: scale(1.6); }
  .hm-legend {
    display: flex; align-items: center; gap: 5px; margin-top: 8px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3);
  }
  .hm-legend i { width: 9px; height: 9px; display: block; }

  /* ---------------- colophon ---------------- */
  footer {
    border-top: 1px solid var(--rule); margin-top: 26px; padding-top: 13px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; letter-spacing: 0.07em; color: var(--ink-3); text-align: center; line-height: 1.7;
  }

  .banner {
    border: 1px solid var(--status-warning); background: var(--paper-2);
    padding: 14px 16px; margin-bottom: 20px; font-size: 15px;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
  .hidden { display: none !important; }

  #tip {
    position: fixed; pointer-events: none; z-index: 50; opacity: 0;
    background: var(--ink); color: var(--paper);
    border-radius: 3px; padding: 4px 8px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px;
    white-space: nowrap; transition: opacity .09s;
  }

  /* ---------------- narrow ---------------- */
  @media (max-width: 900px) {
    .press { grid-template-columns: 1fr; gap: 0; }
    .col-main { border-right: none; padding-right: 0; }
    .col-rail { border-top: 3px double var(--ink); margin-top: 22px; padding-top: 18px; }
    .below-grid { grid-template-columns: 1fr; }
    .below-grid > * + * { border-left: none; padding-left: 0; border-top: 1px solid var(--rule-faint); padding-top: 16px; margin-top: 16px; }
    .lead .body { columns: 1; }
  }
  @media (max-width: 560px) {
    .sheet { padding: 18px 14px 54px; }
    .lede { font-size: 16.5px; text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nameplate .radar .sweep { animation: none; }
    .hm i { transition: none; }
    .hm i[data-d]:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <div class="mast-top">
      <span id="edition">—</span>
      <span class="spacer"></span>
      <label class="hidden" id="backIssueWrap">Back issues
        <select id="backIssue" aria-label="Load a back issue"></select>
      </label>
      <a href="https://joseph-robert-f.github.io/repo-radar/">Data view</a>
      <button id="themeToggle" type="button">Theme</button>
    </div>
    <h1 class="nameplate">
      <svg class="radar" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="5.5"/>
        <path class="sweep" d="M16 16 L26 9" stroke-linecap="round"/>
      </svg>The Repo Radar</h1>
    <div class="mast-rule">
      <span>All the commits fit to print</span>
      <span>·</span>
      <span id="dateline">—</span>
      <span>·</span>
      <span id="scopeline">Public repositories only</span>
    </div>
  </div>

  <div id="loadError" class="banner hidden"></div>

  <div id="paper" class="hidden">
    <div id="backNotice"></div>
    <p class="lede" id="lede"></p>

    <div class="press">
      <div class="col-main" id="colMain"></div>
      <div class="col-rail" id="colRail"></div>
    </div>

    <div class="below">
      <div class="below-grid" id="belowGrid"></div>
    </div>

    <div class="backpage hidden" id="backpage">
      <div class="backpage-grid">
        <div id="classifieds"></div>
        <div id="letters"></div>
      </div>
    </div>

    <footer id="colophon"></footer>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- time, computed at render so nothing is stored in the snapshot ---------- */
const daysSince = (iso) => {
  const t = Date.parse(iso);
  return Number.isFinite(t) ? (Date.now() - t) / 86400000 : NaN;
};
function relTime(iso) {
  const d = daysSince(iso);
  if (!Number.isFinite(d)) return "—";
  const unit = (n, w) => `${n} ${n === 1 ? w : w + "s"} ago`;
  if (d < 0.042) return "moments ago";
  if (d < 1) return unit(Math.max(1, Math.round(d * 24)), "hour");
  if (d < 30) return unit(Math.round(d), "day");
  if (d < 365) return unit(Math.round(d / 30), "month");
  return `${(d / 365).toFixed(1)} years ago`;
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const longDate = (iso) => {
  const d = new Date(iso);
  return Number.isFinite(d.getTime())
    ? `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`
    : "—";
};
const monthYear = (iso) => {
  const d = new Date(iso);
  return Number.isFinite(d.getTime()) ? `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}` : "some time past";
};

/* ---------- newspaper diction ---------- */
const NUMBERS = ["no","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const spell = (n) => (n <= 20 ? NUMBERS[n] : String(n));
const Spell = (n) => { const w = spell(n); return w[0].toUpperCase() + w.slice(1); };
const plural = (n, one, many) => `${spell(n)} ${n === 1 ? one : many || one + "s"}`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const Plural = (n, one, many) => cap(plural(n, one, many));
// Two-letter fragments in repo names are almost always initialisms — "ai", "ui",
// "db" — so set them full caps rather than "Ai".
const titleCase = (s) => s.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim()
  .split(" ").filter(Boolean)
  .map((w) => (w.length <= 2 ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1)))
  .join(" ");

/* ---------- deterministic engravings -------------------------------------
   No image files and no API: each article's art is drawn from a hash of the
   repo name, so it is stable forever and every new repo gets its own without
   anyone doing anything. Ink density tracks activity, so a busy project looks
   heavily worked and a dormant one looks faint — the picture carries the same
   signal as the placement.                                                  */
function seedFrom(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function rng(seed) {
  let a = seed;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** One of six woodcut motifs, chosen by the repo's own name. */
function motif(kind, r, W, H) {
  const p = [];
  if (kind === 0) { // ridgelines
    for (let k = 0; k < 3; k++) {
      const base = H * (0.55 + k * 0.13);
      let d = `M0 ${H} L0 ${base}`;
      for (let x = 0; x <= W; x += W / 7) d += ` L${x} ${base - r() * H * 0.3 * (1 - k * 0.25)}`;
      p.push(`<path d="${d} L${W} ${H} Z" fill="currentColor" opacity="${0.16 + k * 0.16}"/>`);
    }
  } else if (kind === 1) { // swell
    for (let k = 0; k < 5; k++) {
      const y = H * (0.42 + k * 0.12);
      let d = `M0 ${y}`;
      for (let x = 0; x <= W; x += W / 6) d += ` Q ${x + W / 12} ${y - 7 - r() * 9}, ${x + W / 6} ${y}`;
      p.push(`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${1.6 - k * 0.15}" opacity="${0.5 - k * 0.06}"/>`);
    }
  } else if (kind === 2) { // skyline
    let x = 0;
    while (x < W) {
      const w = 12 + r() * 26, h = H * (0.2 + r() * 0.5);
      p.push(`<rect x="${x}" y="${H - h}" width="${w - 3}" height="${h}" fill="currentColor" opacity="${0.2 + r() * 0.4}"/>`);
      x += w;
    }
  } else if (kind === 3) { // orbit
    const cx = W * 0.5, cy = H * 0.52;
    p.push(`<circle cx="${cx}" cy="${cy}" r="${H * 0.2}" fill="currentColor" opacity="0.5"/>`);
    for (let k = 0; k < 3; k++) {
      p.push(`<ellipse cx="${cx}" cy="${cy}" rx="${H * (0.3 + k * 0.13)}" ry="${H * (0.1 + k * 0.05)}"
        fill="none" stroke="currentColor" stroke-width="1.3" opacity="${0.4 - k * 0.08}"
        transform="rotate(${-24 + k * 18} ${cx} ${cy})"/>`);
    }
  } else if (kind === 4) { // cog
    const cx = W * 0.5, cy = H * 0.52, R = H * 0.3, teeth = 10;
    let d = "";
    for (let i = 0; i < teeth * 2; i++) {
      const ang = (i / (teeth * 2)) * Math.PI * 2;
      const rad = i % 2 ? R : R * 1.24;
      d += `${i ? "L" : "M"}${cx + Math.cos(ang) * rad} ${cy + Math.sin(ang) * rad} `;
    }
    p.push(`<path d="${d}Z" fill="currentColor" opacity="0.42"/>`);
    p.push(`<circle cx="${cx}" cy="${cy}" r="${R * 0.4}" fill="var(--paper-2)"/>`);
  } else { // canopy
    for (let k = 0; k < 14; k++) {
      const cx = r() * W, cy = H * (0.3 + r() * 0.5), rad = 6 + r() * 20;
      p.push(`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="currentColor" opacity="${0.09 + r() * 0.2}"/>`);
    }
    p.push(`<rect x="${W * 0.46}" y="${H * 0.6}" width="4" height="${H * 0.4}" fill="currentColor" opacity="0.45"/>`);
  }
  return p.join("");
}

/**
 * @param {object} repo
 * @param {number} h  block height — bigger stories get bigger pictures
 */
function engraving(repo, h) {
  const W = 300, H = h;
  const seed = seedFrom(repo.name);
  const r = rng(seed);
  // Ink weight follows how alive the project is.
  const heat = { hot: 1, active: 0.74, idle: 0.46, dormant: 0.26 }[repo.status] ?? 0.5;
  const rows = Math.round(H / 7);
  const hatch = [];
  for (let i = 0; i < rows; i++) {
    const y = (i + 0.5) * (H / rows);
    const w = (0.35 + r() * 0.9) * heat;
    hatch.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="currentColor" stroke-width="${w.toFixed(2)}" opacity="${(0.1 + r() * 0.16).toFixed(2)}"/>`);
  }
  // Halftone dots, denser where the project is busier.
  const dots = [];
  const cols = 30;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < Math.round(H / 10); j++) {
      if (r() > 0.28 + heat * 0.42) continue;
      const cx = (i + 0.5) * (W / cols), cy = (j + 0.5) * 10;
      dots.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(0.5 + r() * 1.5 * heat).toFixed(2)}" fill="currentColor" opacity="${(0.14 + r() * 0.3).toFixed(2)}"/>`);
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Engraving for ${esc(repo.name)}" style="color:var(--ink)">
    <rect width="${W}" height="${H}" fill="var(--paper-2)"/>
    ${hatch.join("")}
    ${motif(seed % 6, r, W, H)}
    ${dots.join("")}
  </svg>`;
}

/* ---------- the words ---------- */
/**
 * Headlines. Several projects usually land in the same category, so each
 * category carries a few phrasings and the repo's own name picks one — a front
 * page that ran "Slows After a Busy Month" four times would read like a form
 * letter. Chosen by hash, so it's varied but never changes between loads.
 */
function headline(r) {
  const S = titleCase(r.name);
  const c = r.counts;
  const pick = (opts) => opts[seedFrom(r.name) % opts.length];

  if (c.commits7d >= 10) return pick([
    `${S} Logs ${Spell(c.commits7d)} Commits in Seven Days`,
    `Busy Week at ${S}: ${Spell(c.commits7d)} Commits`,
    `${Spell(c.commits7d)} Commits Land at ${S}`,
  ]);
  if (c.commits7d > 0 && c.openPRs > 0) return pick([
    `${S} Presses On as ${Spell(c.openPRs)} Reviews Wait`,
    `Work and Backlog Both Grow at ${S}`,
    `${S} Ships While ${Spell(c.openPRs)} Reviews Queue`,
  ]);
  if (c.openPRs >= 3) return pick([
    `${Spell(c.openPRs)} Reviews Pile Up at ${S}`,
    `Review Queue Lengthens at ${S}`,
  ]);
  if (c.commits7d > 0) return pick([
    `Work Continues Quietly at ${S}`,
    `${S} Ticks Along`,
    `Steady Hands at ${S}`,
  ]);
  if (c.openPRs > 0) return pick([
    `${S} Idles With ${Plural(c.openPRs, "Review")} Outstanding`,
    `${Plural(c.openPRs, "Review")} Await a Verdict at ${S}`,
  ]);
  if (r.status === "dormant") return pick([
    `${S} Lies Quiet Since ${monthYear(r.lastActivityAt)}`,
    `No Word From ${S} Since ${monthYear(r.lastActivityAt)}`,
  ]);
  if (c.commits30d > 0) return pick([
    `${S} Slows After a Busy Month`,
    `Quiet Week Follows a Full Month at ${S}`,
    `${S} Rests After ${Plural(c.commits30d, "Commit")}`,
    `The Pace Eases at ${S}`,
  ]);
  return pick([`${S} Holds Steady`, `Nothing Stirring at ${S}`, `${S} Stands Pat`]);
}

function deck(r) {
  const c = r.counts, bits = [];
  if (c.openPRs) bits.push(plural(c.openPRs, "open review"));
  if (c.openIssues) bits.push(plural(c.openIssues, "open issue"));
  if (c.branches) bits.push(plural(c.branches, "live branch", "live branches"));
  if (!bits.length) bits.push("nothing outstanding");
  return cap(`${bits.join(", ")} — last touched ${relTime(r.lastActivityAt)}.`);
}

function bodyCopy(r, user) {
  const c = r.counts, ps = [];
  const S = titleCase(r.name);
  const first = [];
  first.push(`<span class="dateline">${esc(user)} —</span>`);
  // Repo descriptions rarely end in punctuation; without this the next
  // sentence runs straight into them.
  const stop = (s) => (/[.!?]$/.test(s.trim()) ? esc(s.trim()) : esc(s.trim()) + ".");
  first.push(r.description
    ? stop(r.description)
    : `The ${esc(r.language || "untyped")} project known as ${esc(r.name)} carries no description of itself.`);
  if (c.commits7d) {
    first.push(`${Spell(c.commits7d)} ${c.commits7d === 1 ? "commit has" : "commits have"} landed in the past week, ${spell(c.commits30d)} in the month.`);
  } else if (c.commits30d) {
    first.push(`Nothing has landed this week, though ${plural(c.commits30d, "commit")} arrived over the month.`);
  } else {
    first.push(`No commits have landed in thirty days.`);
  }
  ps.push(first.join(" "));

  const second = [];
  if (c.openPRs) {
    second.push(`${Spell(c.openPRs)} ${c.openPRs === 1 ? "review remains" : "reviews remain"} open${
      r.openPRs[0] ? `, the foremost being <em>${esc(r.openPRs[0].title)}</em>` : ""}.`);
  }
  if (c.openIssues) second.push(`${Spell(c.openIssues)} ${c.openIssues === 1 ? "issue stands" : "issues stand"} unresolved.`);
  if (c.branches) {
    second.push(`${Spell(c.branches)} ${c.branches === 1 ? "branch lives" : "branches live"} apart from ${esc(r.defaultBranch || "the trunk")}.`);
  }
  if (!second.length) second.push(`Nothing is presently outstanding; the trunk stands clear.`);
  ps.push(second.join(" "));

  // Today's issue carries the full commit preview; an archived edition keeps
  // only the most recent one, to stay small. Accept either.
  const latest = r.commits?.[0] || r.latestCommit;
  if (latest) ps.push(`Most recently: <em>${esc(latest.message)}</em>.`);
  return ps.map((p) => `<p>${p}</p>`).join("");
}

/* ---------- the front page ---------- */
function stateOfTheWorld(d) {
  const s = d.summary, bits = [];
  const busiest = [...d.repos].sort((a, b) => b.counts.commits7d - a.counts.commits7d)[0];
  if (s.commits7d === 0) bits.push("The presses were still this week — not a single commit anywhere.");
  else if (busiest && busiest.counts.commits7d >= s.commits7d * 0.6)
    bits.push(`${Spell(s.commits7d)} commits this week, the bulk of them at <b>${esc(titleCase(busiest.name))}</b>.`);
  else {
    const moving = d.repos.filter((r) => r.counts.commits7d > 0).length;
    bits.push(`${Spell(s.commits7d)} commits this week across ${plural(moving, "project")}.`);
  }
  const worst = d.attention[0];
  if (!worst) {
    bits.push(`<span class="quiet">Nothing has gone stale; every open thread has moved recently.</span>`);
  } else {
    bits.push(`${Plural(d.attention.length, "matter")} await attention, the oldest for ${plural(Math.round(daysSince(worst.updatedAt)), "day")} at <b>${esc(titleCase(worst.repo))}</b>.`);
  }
  return bits.join(" ");
}

/* ---------- what changed since the last edition -------------------------
   The whole point of a daily paper. Compares the current issue against the
   most recent archived one; everything is derived from the two files, so it
   stays correct when you page back through the archive too.              */
function diffEditions(now, prev) {
  const index = (e) => new Map((e.repos || []).map((r) => [r.name, r]));
  const was = index(prev), is = index(now);
  const d = {
    prsOpened: [], prsClosed: [], issuesOpened: [], issuesClosed: [],
    branchesNew: [], branchesLanded: [], statusChanges: [],
    newRepos: [], moved: [], perRepo: new Map(),
  };

  for (const [name, b] of is) {
    const a = was.get(name);
    if (!a) {
      d.newRepos.push(name);
      d.perRepo.set(name, "new");
      continue;
    }
    const nums = (xs) => new Set((xs || []).map((x) => x.number));
    const names = (xs) => new Set((xs || []).map((x) => x.name));

    const prNow = nums(b.openPRs), prWas = nums(a.openPRs);
    for (const p of b.openPRs || []) if (!prWas.has(p.number)) d.prsOpened.push({ repo: name, ...p });
    for (const p of a.openPRs || []) if (!prNow.has(p.number)) d.prsClosed.push({ repo: name, ...p });

    const isNow = nums(b.openIssues), isWas = nums(a.openIssues);
    for (const i of b.openIssues || []) if (!isWas.has(i.number)) d.issuesOpened.push({ repo: name, ...i });
    for (const i of a.openIssues || []) if (!isNow.has(i.number)) d.issuesClosed.push({ repo: name, ...i });

    const brNow = names(b.branches), brWas = names(a.branches);
    for (const x of b.branches || []) if (!brWas.has(x.name)) d.branchesNew.push({ repo: name, ...x });
    for (const x of a.branches || []) if (!brNow.has(x.name)) d.branchesLanded.push({ repo: name, ...x });

    if (a.status !== b.status) d.statusChanges.push({ repo: name, from: a.status, to: b.status });

    const advanced = Date.parse(b.lastActivityAt) > Date.parse(a.lastActivityAt);
    if (advanced) d.moved.push(name);
    d.perRepo.set(name, advanced ? "moved" : null);
  }
  return d;
}

/** Rank order for status, so we can say "woke up" or "drifted off". */
const STATUS_RANK = { hot: 3, active: 2, idle: 1, dormant: 0 };

function sinceHTML(diff, prevDate) {
  if (!diff) {
    return `<div class="box rules since"><h3>Since the last edition</h3>
      <p class="none">This is the first edition on file. From tomorrow this column will
      say what moved.</p></div>`;
  }
  const lines = [];
  const list = (xs, n = 2) => xs.slice(0, n).map((x) => `<b>${esc(x.title || x.name)}</b>`).join(" and ")
    + (xs.length > n ? ` and ${plural(xs.length - n, "other")}` : "");

  if (diff.prsOpened.length) lines.push(`<p>${Plural(diff.prsOpened.length, "review")} opened — ${list(diff.prsOpened)}.</p>`);
  if (diff.prsClosed.length) lines.push(`<p>${Plural(diff.prsClosed.length, "review")} <span class="gone">closed</span> — ${list(diff.prsClosed)}.</p>`);
  if (diff.issuesOpened.length) lines.push(`<p>${Plural(diff.issuesOpened.length, "issue")} raised — ${list(diff.issuesOpened)}.</p>`);
  if (diff.issuesClosed.length) lines.push(`<p>${Plural(diff.issuesClosed.length, "issue")} <span class="gone">resolved</span>.</p>`);
  if (diff.branchesLanded.length) lines.push(`<p>${Plural(diff.branchesLanded.length, "branch", "branches")} landed — ${list(diff.branchesLanded)}.</p>`);
  if (diff.branchesNew.length) lines.push(`<p>${Plural(diff.branchesNew.length, "new branch", "new branches")} appeared.</p>`);

  for (const s of diff.statusChanges.slice(0, 3)) {
    const up = (STATUS_RANK[s.to] ?? 0) > (STATUS_RANK[s.from] ?? 0);
    lines.push(`<p><b>${esc(titleCase(s.repo))}</b> ${up ? "woke up" : "drifted off"} — ${esc(s.from)} to ${esc(s.to)}.</p>`);
  }
  if (diff.newRepos.length) lines.push(`<p>${Plural(diff.newRepos.length, "project")} joined the register: <b>${diff.newRepos.map((n) => esc(titleCase(n))).join(", ")}</b>.</p>`);

  if (!lines.length) {
    lines.push(`<p class="none">Nothing moved. ${diff.moved.length ? `${Plural(diff.moved.length, "project")} took commits, but no reviews, issues or branches changed hands.` : "A genuinely quiet day."}</p>`);
  } else if (diff.moved.length) {
    lines.push(`<p class="none">${Plural(diff.moved.length, "project")} also took new commits.</p>`);
  }

  return `<div class="box rules since"><h3>Since ${esc(prevDate)}</h3>${lines.join("")}</div>`;
}

function articleHTML(r, tier, user, mark) {
  const art = { lead: 200, second: 132, brief: 96 }[tier];
  const link = (t) => (r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${t}</a>` : t);
  return `<article class="${tier === "lead" ? "lead" : tier === "second" ? "second" : "brief-story"}">
    <div class="kicker"><span class="pip ${r.status}"></span>${esc(r.status)}${r.language ? ` · ${esc(r.language)}` : ""}${r.pinned ? " · Pinned" : ""}${
      mark === "new" ? `<span class="chip new">New</span>` : mark === "moved" ? `<span class="chip moved">Moved</span>` : ""}</div>
    <h2 class="hed">${link(esc(headline(r)))}</h2>
    <p class="deck">${esc(deck(r))}</p>
    ${art ? `<figure>${engraving(r, art)}<figcaption>An impression of ${esc(r.name)}, struck from its name; ink weight follows activity.</figcaption></figure>` : ""}
    <div class="byline">Filed by the Collector</div>
    <div class="body">${bodyCopy(r, user)}</div>
  </article>`;
}

function noticesHTML(d) {
  if (!d.attention.length) {
    return `<div class="box rules"><h3>Stop Press</h3>
      <p class="allclear">Nothing is rotting. Every open review, assigned issue and live branch has moved recently.</p></div>`;
  }
  const rows = d.attention.map((t) => {
    const days = Math.round(daysSince(t.updatedAt));
    const cls = days > 30 ? "crit" : "warn";
    const tag = t.url ? "a" : "div";
    const href = t.url ? ` href="${esc(t.url)}" target="_blank" rel="noopener"` : "";
    return `<${tag} class="notice"${href}>
      <span class="n-title">${esc(t.title)}</span>
      <span class="n-meta">${esc(t.type)} · ${esc(t.repo)} · <span class="${cls}">waiting ${plural(days, "day")}</span></span>
    </${tag}>`;
  }).join("");
  return `<div class="box rules"><h3>Stop Press — ${plural(d.attention.length, "matter")} waiting</h3>${rows}</div>`;
}

function weatherHTML(d) {
  const days = d.heatmap || [];
  if (!days.length) return "";
  const max = Math.max(1, ...days.map((x) => x.count));
  const lvl = (n) => (n === 0 ? 0 : Math.min(4, Math.ceil((n / max) * 4)));
  const lead = new Date(days[0].date + "T00:00:00Z").getUTCDay();
  const cells = Array.from({ length: lead }, () => `<i style="visibility:hidden"></i>`).join("")
    + days.map((x) => `<i data-l="${lvl(x.count)}" data-d="${x.date}" data-n="${x.count}"></i>`).join("");
  const total = days.reduce((n, x) => n + x.count, 0);

  // Month labels: one per column, printed only where the month turns over, so
  // you can tell which patch of weather is which. An unlabelled grid is pretty
  // and says nothing.
  const weeks = Math.ceil((lead + days.length) / 7);
  let lastMonth = -1;
  const months = Array.from({ length: weeks }, (_, w) => {
    const di = w * 7 - lead;
    const day = days[Math.max(0, di)];
    if (!day) return `<span></span>`;
    const m = new Date(day.date + "T00:00:00Z").getUTCMonth();
    if (di < 0 || m === lastMonth) return `<span></span>`;
    lastMonth = m;
    return `<span>${MONTHS[m].slice(0, 3)}</span>`;
  }).join("");

  return `<div class="box"><h3>The Year in Weather</h3>
    <div class="hm-scroll">
      <div class="hm-months" style="grid-template-columns:repeat(${weeks},9px)">${months}</div>
      <div class="hm" id="heatmap">${cells}</div>
    </div>
    <div class="hm-legend"><span>Dry</span>
      <i style="background:var(--hm-0)"></i><i style="background:var(--hm-1)"></i><i style="background:var(--hm-2)"></i><i style="background:var(--hm-3)"></i><i style="background:var(--hm-4)"></i>
      <span>Wet</span><span style="margin-left:auto">${total} commits</span></div></div>`;
}

/* ---------- the back page: classifieds and letters ----------------------
   Both are the same data the dashboard lists, set as newspaper furniture. The
   review queue reads better as small ads than as a list, and an open issue is
   already a letter to the editor in everything but typography.            */
function classifiedsHTML(d) {
  const ads = d.repos.flatMap((r) => (r.openPRs || []).map((p) => ({ repo: r, pr: p })));
  if (!ads.length) {
    return `<div class="secthead">Classifieds</div>
      <p class="allclear">No positions vacant. Every review has been filled.</p>`;
  }
  const rows = ads.map(({ repo, pr }) => {
    const waited = Math.round(daysSince(pr.updatedAt));
    const leadIn = pr.isDraft
      ? "Not yet ready · work in progress"
      : [ "Wanted — one reviewer", "Seeking — a second pair of eyes", "For review, without delay" ][seedFrom(repo.name + pr.number) % 3];
    return `<div class="ad">
      <span class="lead-in">${esc(leadIn)}</span>
      <a href="${esc(pr.url)}" target="_blank" rel="noopener">#${pr.number} ${esc(pr.title)}</a>
      <span class="where">${esc(repo.name)}${repo.language ? ` · ${esc(repo.language)}` : ""} · ${
        waited < 1 ? "posted today" : `waiting ${plural(waited, "day")}`}. Apply within.</span>
    </div>`;
  }).join("");
  return `<div class="secthead">Classifieds <span class="count">· ${plural(ads.length, "position")} vacant</span></div>
    <div class="ads">${rows}</div>`;
}

function lettersHTML(d) {
  const letters = d.repos.flatMap((r) => (r.openIssues || []).map((i) => ({ repo: r, issue: i })));
  if (!letters.length) {
    return `<div class="secthead">Letters to the Editor</div>
      <p class="allclear">No correspondence this week. The postbag is empty.</p>`;
  }
  const rows = letters.map(({ repo, issue }) => {
    const age = Math.round(daysSince(issue.createdAt));
    return `<div class="letter">
      <span class="salut">Sir —</span>
      <a href="${esc(issue.url)}" target="_blank" rel="noopener">${esc(issue.title)}</a>.
      ${age < 1 ? "Raised today" : `Raised ${plural(age, "day")} ago`} and still standing.
      <span class="sign">— ${issue.assigned ? "the assignee" : "a correspondent"}, ${esc(repo.name)}</span>
    </div>`;
  }).join("");
  return `<div class="secthead">Letters to the Editor <span class="count">· ${plural(letters.length, "letter")}</span></div>${rows}`;
}

/**
 * Obituaries — projects that crossed into dormant since the last edition.
 * Written gently on purpose: a repo going quiet is usually a pause, not a
 * death, and the reader may well be about to pick it back up.
 */
function obituariesHTML(diff, repos) {
  const gone = (diff?.statusChanges || []).filter((s) => s.to === "dormant");
  if (!gone.length) return "";
  const rows = gone.map((s) => {
    const r = repos.find((x) => x.name === s.repo);
    const branches = r?.counts?.branches || 0;
    return `<div class="obit">
      <span class="who">${esc(s.repo)}</span>${r?.language ? `, of ${esc(r.language)}` : ""} —
      quiet since ${esc(monthYear(r?.lastActivityAt))}.
      ${branches ? `It leaves ${plural(branches, "branch", "branches")} behind.` : "It leaves nothing outstanding."}
    </div>`;
  }).join("");
  return `<div class="box"><h3>Obituaries</h3>${rows}</div>`;
}

/**
 * The Forecast — the last seven days of the daily series against the seven
 * before. Rule-based and deterministic; the same numbers always give the same
 * forecast. Back issues don't carry the series, so this simply doesn't run.
 */
function forecastHTML(d) {
  const series = d.repos.map((r) => r.daily).filter((x) => Array.isArray(x) && x.length >= 14);
  if (!series.length) return "";
  const sumRange = (from, to) =>
    series.reduce((n, s) => n + s.slice(from, to).reduce((a, b) => a + b, 0), 0);
  const week = sumRange(-7, undefined);
  const before = sumRange(-14, -7);

  // Spelling one number and printing the other as a numeral in the same
  // sentence reads badly, and spell() falls back to numerals above twenty. So
  // pick one form for the pair.
  const bothSpelled = week <= 20 && before <= 20;
  const n = (x) => (bothSpelled ? spell(x) : String(x));
  const N = (x) => (bothSpelled ? Spell(x) : String(x));

  let outlook;
  if (week === 0 && before === 0) outlook = "Settled and dry. Nothing has landed in a fortnight.";
  else if (week === 0) outlook = `Dry spell. ${N(before)} commits the week before, none since.`;
  else if (before === 0) outlook = `Breaking out. ${N(week)} commits after a fortnight of nothing.`;
  else if (week >= before * 1.5) outlook = `Brightening — ${N(week)} commits against ${n(before)} the week before.`;
  else if (week * 1.5 <= before) outlook = `Easing off — ${N(week)} commits against ${n(before)} the week before.`;
  else outlook = `Steady — ${N(week)} commits, much as the week before.`;

  const waiting = (d.attention || []).length;
  const queue = waiting
    ? `${Plural(waiting, "matter")} outstanding; the queue holds unless someone clears it.`
    : `Nothing outstanding. Clear skies over the review desk.`;

  return `<div class="box forecast"><h3>The Forecast</h3>
    <span class="glass">Set by the glass, not by hope</span>
    <p>${outlook}</p><p>${queue}</p></div>`;
}

/**
 * On This Day — pulled from the digests in editions/index.json, which are kept
 * forever precisely so this keeps working after the rich editions are pruned.
 */
function onThisDayHTML(index, todayISO) {
  const digest = index?.digest || {};
  const today = Date.parse(todayISO + "T00:00:00Z");
  const candidates = [
    [365, "A year ago today"], [180, "Six months ago"], [90, "Three months ago"], [30, "A month ago"],
  ];
  for (const [days, label] of candidates) {
    const key = new Date(today - days * 86400000).toISOString().slice(0, 10);
    const g = digest[key];
    if (!g) continue;
    // One form per sentence: spell() gives numerals above twenty, so if any
    // figure here is large, print them all as numerals.
    const all = [g.commits7d, g.repos, g.openPRs, g.needsAttention];
    const p2 = all.every((x) => x <= 20)
      ? (n, one, many) => plural(n, one, many)
      : (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
    return `<div class="box onthis"><h3>On This Day</h3>
      <p><b>${esc(label)}</b> — ${p2(g.commits7d, "commit")} that week across
      ${p2(g.repos, "project")}, ${p2(g.openPRs, "review")} open and
      ${p2(g.needsAttention, "matter")} waiting.</p></div>`;
  }
  return "";
}

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(e, text) {
  tip.textContent = text; tip.style.opacity = "1";
  const b = tip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY - b.height - 10;
  if (x + b.width > innerWidth - 8) x = e.clientX - b.width - 12;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.opacity = "0");

$("#themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark"));
});

/* ---------- setting the page ----------------------------------------------
   Takes an issue — either today's snapshot or an archived edition — and sets
   the whole front page from it. Back issues are the same shape minus the
   heatmap and the full commit list, so the weather box simply doesn't run. */
function setPage(d, { diff, prevDate, backIssue, index } = {}) {
  $("#paper").classList.remove("hidden");

  const stamp = d.generatedAt || `${d.date}T12:00:00Z`;
  $("#dateline").textContent = longDate(stamp);
  $("#scopeline").textContent = `${d.repos.length} public repositories · ${d.user}`;
  // Edition number counts days since the paper was founded.
  const founded = Date.parse("2026-08-05T00:00:00Z");
  const no = Math.max(1, Math.round((Date.parse(stamp) - founded) / 86400000) + 1);
  $("#edition").textContent = `Vol. I · No. ${no} · ${backIssue ? "Back Issue" : "Late Edition"}`;
  $("#lede").innerHTML = stateOfTheWorld(d);

  $("#backNotice").innerHTML = backIssue
    ? `<div class="backnotice"><b>Back issue</b> — this is the paper as it stood on
       ${esc(longDate(stamp))}. <button type="button" id="toToday">Return to today's edition</button></div>`
    : "";
  const back = $("#toToday");
  if (back) back.addEventListener("click", () => { $("#backIssue").value = ""; loadToday(); });

  // Placement is the ranking: the issue already orders repos by real activity,
  // so position on the page is the story's importance.
  const live = d.repos.filter((r) => r.status !== "dormant");
  const dormant = d.repos.filter((r) => r.status === "dormant");
  const [lead, ...restLive] = live.length ? live : d.repos;
  const seconds = restLive.slice(0, 2);
  const rest = restLive.slice(2);
  const mark = (r) => diff?.perRepo.get(r.name);

  $("#colMain").innerHTML = lead
    ? articleHTML(lead, "lead", d.user, mark(lead))
    : `<p class="lede">No public repositories to report.</p>`;

  $("#colRail").innerHTML =
    (backIssue ? "" : sinceHTML(diff, prevDate))
    + noticesHTML(d)
    + obituariesHTML(diff, d.repos)
    + forecastHTML(d)
    + weatherHTML(d)
    + (backIssue ? "" : onThisDayHTML(index, String(d.generatedAt || d.date).slice(0, 10)))
    + (dormant.length
      ? `<div class="box"><h3>In Brief</h3>${dormant.map((r) => `
          <div class="brief-item">
            <span class="bi-name">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : esc(r.name)}</span>
            <span class="bi-meta"> — quiet since ${esc(monthYear(r.lastActivityAt))}.</span>
          </div>`).join("")}</div>`
      : "");

  $("#belowGrid").innerHTML = [...seconds.map((r) => articleHTML(r, "second", d.user, mark(r))),
    ...rest.map((r) => articleHTML(r, "brief", d.user, mark(r)))].join("")
    || `<p>Nothing further to report.</p>`;

  $("#backpage").classList.remove("hidden");
  $("#classifieds").innerHTML = classifiedsHTML(d);
  $("#letters").innerHTML = lettersHTML(d);

  const hm = $("#heatmap");
  if (hm) {
    const move = (e) => {
      const c = e.target.closest("i[data-d]");
      if (!c) { hideTip(); return; }
      showTip(e, `${c.dataset.n} commits · ${c.dataset.d}`);
    };
    hm.addEventListener("mouseover", move);
    hm.addEventListener("mousemove", move);
    hm.addEventListener("mouseleave", hideTip);
  }

  $("#colophon").innerHTML =
    `The Repo Radar is set from <code>data/snapshot.json</code>, gathered every six hours by <a href="https://github.com/joseph-robert-f/repo-radar">repo-radar</a>.<br>
     Private repositories are not collected. Engravings are struck deterministically from each project's name.<br>
     Impression taken ${esc(stamp)}. <a href="https://joseph-robert-f.github.io/repo-radar/">The data view</a> remains available to subscribers.`;
  scrollTo({ top: 0, behavior: "instant" });
}

/* ---------- press run ---------- */
const jsonOr = (url, fallback) =>
  fetch(url, { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : fallback))
    .catch(() => fallback);

function loadToday() {
  return Promise.all([
    fetch("data/snapshot.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    jsonOr("editions/index.json", { dates: [] }),
  ]).then(([snap, index]) => {
    const today = String(snap.generatedAt).slice(0, 10);
    const dates = (index.dates || []).filter(Boolean).sort().reverse();

    // Offer every archived day except today's, which is what you're looking at.
    const back = $("#backIssue");
    const older = dates.filter((x) => x !== today);
    if (older.length) {
      $("#backIssueWrap").classList.remove("hidden");
      back.innerHTML = `<option value="">Today</option>`
        + older.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
    }

    const prevDate = older[0];
    if (!prevDate) return setPage(snap, { diff: null, index });
    return jsonOr(`editions/${prevDate}.json`, null).then((prev) =>
      setPage(snap, { diff: prev ? diffEditions(snap, prev) : null, prevDate, index }));
  });
}

$("#backIssue").addEventListener("change", (e) => {
  const date = e.target.value;
  if (!date) return loadToday();
  jsonOr(`editions/${date}.json`, null).then((ed) => {
    if (ed) setPage(ed, { backIssue: true });
  });
});

loadToday()
  .catch((err) => {
    const b = $("#loadError");
    b.classList.remove("hidden");
    b.innerHTML = `<b>The presses have jammed.</b> Couldn't load <code>data/snapshot.json</code> (${esc(err.message)}).<br>
      Opening this file over <code>file://</code> won't work — browsers block the fetch.
      Run <code>python3 -m http.server 8000</code> in the repo and open <code>http://localhost:8000</code>.`;
  });
</script>
</body>
</html>
