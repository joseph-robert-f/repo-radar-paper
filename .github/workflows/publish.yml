name: Set the paper

# This repository is presentation only. The data comes from repo-radar, which
# does the collecting; here we fetch the snapshot it publishes, commit it when
# it has actually changed, and deploy the front page.
#
# No secrets and no cross-repo credentials: repo-radar is public, so its
# snapshot is readable over raw.githubusercontent.com with no auth at all. The
# page still reads a static file sitting next to it, so visitors never make a
# request to GitHub — the property the whole project is built on.

on:
  schedule:
    # Offset from repo-radar's own 6-hourly cron so we run after it, not with
    # it. GitHub's scheduler drifts by up to an hour or two anyway; the offset
    # only has to be bigger than the collect job's runtime, which is ~20s.
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper
  cancel-in-progress: false

env:
  SNAPSHOT_URL: https://raw.githubusercontent.com/joseph-robert-f/repo-radar/main/data/snapshot.json

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the latest snapshot from repo-radar
        run: |
          mkdir -p data
          curl -fsSL --retry 4 --retry-delay 3 "$SNAPSHOT_URL" -o data/snapshot.fetched.json

      # The fetched file comes from a repository that has no idea this site
      # consumes it, and whose own tests pass whatever it does to the shape. A
      # renamed field there would otherwise hollow this page out quietly — no
      # Forecast, no Corrections, every story on its dullest angle — behind a
      # green build. This turns that into a failure on the same refresh, naming
      # the field and the sections that die with it.
      #
      # Runs before the file is moved into place, so a broken schema leaves the
      # last good snapshot published rather than replacing it with one the page
      # can't set itself from.
      - name: Check the snapshot against what the paper reads
        run: |
          node scripts/check-snapshot.mjs --selftest
          node scripts/check-snapshot.mjs data/snapshot.fetched.json

      - name: Take delivery of the snapshot
        run: mv data/snapshot.fetched.json data/snapshot.json

      - name: File today's edition into the archive
        run: node scripts/edition.mjs

      - name: Commit the snapshot and edition if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # generatedAt moves whenever repo-radar recollects; everything else
          # only moves when something actually happened. Compare without it so a
          # quiet day doesn't take a commit. Editions carry no timestamps at
          # all, so they compare as-is.
          snapshot_changed=false
          if ! git diff --quiet -- data/snapshot.json; then
            before=$(git show HEAD:data/snapshot.json 2>/dev/null | grep -v '"generatedAt"' || true)
            after=$(grep -v '"generatedAt"' data/snapshot.json || true)
            [ "$before" != "$after" ] && snapshot_changed=true
          fi

          editions_changed=false
          git diff --quiet -- editions || editions_changed=true
          [ -n "$(git ls-files --others --exclude-standard -- editions)" ] && editions_changed=true

          if [ "$snapshot_changed" = false ] && [ "$editions_changed" = false ]; then
            echo "only the timestamp moved — not committing"
            git checkout -- data/snapshot.json
            exit 0
          fi

          git add data/snapshot.json editions
          git commit -m "chore: set from a fresh snapshot"
          git push
          echo "committed — snapshot: $snapshot_changed, editions: $editions_changed"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

    outputs:
      page: ${{ steps.deploy.outputs.page_url }}
